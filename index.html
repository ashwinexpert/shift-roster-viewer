<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Shift Roster Viewer</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Shift Roster</h1>
            <span id="monthDisplay" class="month-badge">August 2026</span>
        </header>

        <!-- Admin Controls (Only visible to you) -->
        <div class="admin-controls">
            <button onclick="window.open('converter.html', '_blank')" class="btn btn-converter">
                🔄 Update Roster
            </button>
            <button onclick="showUpdateInstructions()" class="btn btn-help">
                📤 Upload to GitHub
            </button>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <!-- Today's View -->
        <section class="today-section">
            <h2>📍 <span id="todayDate">Today</span></h2>
            <div id="todayShiftSummary" class="shift-summary">
                <p style="color:rgba(255,255,255,0.8); text-align:center; padding:20px;">
                    Loading roster...
                </p>
            </div>
        </section>

        <!-- Search -->
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="🔍 Search employee name..." />
            <button onclick="searchEmployee()" class="btn btn-search">Search</button>
            <button onclick="clearSearch()" class="btn btn-clear">✕</button>
        </section>

        <!-- Search Results -->
        <div id="searchResults" style="display:none;" class="search-results"></div>

        <!-- Full Month View -->
        <section class="full-month-section">
            <h2>📊 Full Month Roster</h2>
            <div id="fullMonthTable" class="table-container">
                <p style="color:#666; text-align:center; padding:20px;">
                    Loading...
                </p>
            </div>
        </section>

        <!-- Legend -->
        <div class="legend">
            <span class="legend-item"><span class="dot" style="background:#FF6B35;"></span> A (7:30-4:30)</span>
            <span class="legend-item"><span class="dot" style="background:#F7931E;"></span> B (1:30-10:00)</span>
            <span class="legend-item"><span class="dot" style="background:#2C3E50;"></span> C (10:00-7:30)</span>
            <span class="legend-item"><span class="dot" style="background:#27AE60;"></span> GEN (9:00-6:00)</span>
            <span class="legend-item"><span class="dot" style="background:#8E44AD;"></span> MID (11:00-8:00)</span>
            <span class="legend-item"><span class="dot" style="background:#95A5A6;"></span> WO (Off)</span>
            <span class="legend-item"><span class="dot" style="background:#E74C3C;"></span> LV (Leave)</span>
        </div>

        <footer>
            <small>📅 Updated: <span id="lastUpdated">Today</span> | Data stored on GitHub</small>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
