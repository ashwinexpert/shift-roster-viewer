<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Shift Roster Viewer</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Shift Roster</h1>
            <span id="monthDisplay" class="month-badge">August 2026</span>
        </header>

        <!-- Full Month View - NOW FIRST -->
        <section class="full-month-section">
            <div class="table-header">
                <span class="table-title">📊 Full Month Roster</span>
                <span class="table-subtitle" id="monthSubtitle">August 2026</span>
            </div>
            <div id="fullMonthTable" class="table-container">
                <p style="color:#666; text-align:center; padding:20px;">
                    Loading...
                </p>
            </div>
        </section>

        <!-- Search - COMPACT -->
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="🔍 Search employee..." />
            <button onclick="searchEmployee()" class="btn btn-search">Go</button>
            <button onclick="clearSearch()" class="btn btn-clear">✕</button>
        </section>

        <!-- Search Results -->
        <div id="searchResults" style="display:none;" class="search-results"></div>

        <!-- TODAY View - NOW AFTER TABLE -->
        <section class="today-section">
            <div class="today-header">
                <span class="today-icon">📍</span>
                <span class="today-label">TODAY</span>
                <span id="todayDate" class="today-date">09/08/2026 (Sunday)</span>
            </div>
            <div id="todayShiftSummary" class="shift-summary">
                <p style="color:rgba(255,255,255,0.8); text-align:center; padding:20px;">
                    Loading roster...
                </p>
            </div>
        </section>

        <!-- Legend -->
        <div class="legend">
            <span class="legend-item"><span class="dot" style="background:#FF6B35;"></span> A</span>
            <span class="legend-item"><span class="dot" style="background:#F7931E;"></span> B</span>
            <span class="legend-item"><span class="dot" style="background:#2C3E50;"></span> C</span>
            <span class="legend-item"><span class="dot" style="background:#27AE60;"></span> GEN</span>
            <span class="legend-item"><span class="dot" style="background:#8E44AD;"></span> MID</span>
            <span class="legend-item"><span class="dot" style="background:#95A5A6;"></span> WO</span>
            <span class="legend-item"><span class="dot" style="background:#E74C3C;"></span> LV</span>
        </div>

        <!-- Admin Controls - At Bottom -->
        <div class="admin-controls">
            <button onclick="window.open('converter.html', '_blank')" class="btn btn-converter">
                🔄 Update
            </button>
            <button onclick="showUpdateInstructions()" class="btn btn-help">
                📤 Upload
            </button>
        </div>

        <footer>
            <small>📅 Updated: <span id="lastUpdated">Today</span></small>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
